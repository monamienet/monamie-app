# Builds a signed app bundle and publishes it to the Google Play internal
# testing track on every push to main (i.e. every merged pull request) that
# changes an input of the Android app bundle.
#
# Line-by-line walkthrough: docs/pt-br/entendendo-o-ci.md
#
# Do NOT rename this file: github.run_number (used as versionCode) is counted
# per workflow file and would restart at 1, colliding with released versions.
name: Deploy to Play (internal)

on:
  push:
    branches: [main]
    # Only inputs of the Android app bundle. Add new build inputs here
    # (e.g. l10n.yaml, fonts/, local packages) or merges will not deploy.
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'distribution/**'
      - '.github/scripts/check-release-notes.sh'
      - '.github/workflows/deploy-play-internal.yml'
  workflow_dispatch:

# Serializes Play changes: a new run waits for the one in progress instead of
# cancelling it halfway through an upload. Shared with promote-play-closed.yml.
concurrency:
  group: play
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: play-internal
    # id-token: write lets the job request the GitHub OIDC token exchanged
    # for short-lived Google credentials (Workload Identity Federation).
    permissions:
      contents: read
      id-token: write
    steps:
      # Full history and tags: the release notes check compares with the last
      # v* tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fails before anything is built or uploaded if the notes are missing,
      # too long, or not updated since the last release.
      - name: Check release notes
        run: .github/scripts/check-release-notes.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      # Give CI more heap than the 2g that android/gradle.properties keeps for dev laptops.
      # ~/.gradle/gradle.properties takes precedence over the project file.
      - name: Raise Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

      - name: Restore release signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Names the missing secret; validateReleaseSigning (Gradle) is the
          # second safety net for any release build.
          for v in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is empty"; exit 1; }
          done
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          EOF

      - run: flutter pub get

      # Integration tests are skipped: they need the Firebase emulators.
      - run: flutter test test/unit

      # The build fetches the central project's google-services.json with
      # `tool/partner.dart firebase`. Partners' projects are bound at runtime.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.30.2

      # Keyless auth for the build: impersonates a read-only service account
      # that can only list and read Firebase app configs (custom role
      # firebaseAppConfigReader, bound on monamienet-app only). It is separate from the publisher account
      # below, so the build, which runs third-party Gradle and pub code, never
      # holds the Play credential. Setup: docs/pt-br/publicar-teste-interno.md
      # (steps A5, A6, C4)
      - id: auth-config
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/787253151660/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: wlif-monamie-app-config@ci-cd-management.iam.gserviceaccount.com

      # versionCode = run number + 100: CI uses 101 and up; manual uploads (such as
      # the first one of a new app) use 100 or less.
      - run: flutter build appbundle --release --build-number=$((GITHUB_RUN_NUMBER + 100))

      # Keyless auth: impersonates the dedicated publisher service account.
      # Setup: docs/pt-br/publicar-teste-interno.md (steps A2-A4, C9-C12)
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/787253151660/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: wlif-monamie-app-play@ci-cd-management.iam.gserviceaccount.com

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: org.monamienet.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          # whatsnew-pt-BR and whatsnew-en-US, written in each PR (AGENTS.md,
          # "Releases"). Promotion to closed testing copies them along.
          whatsNewDirectory: distribution/whatsnew
