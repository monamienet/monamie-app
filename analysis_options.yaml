analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Generated code (mockito mocks, freezed classes, *.g.dart parts).
    - "**/*.mocks.dart"
    - "**/*.freezed.dart"
    - "**/*.g.dart"
include: package:flutter_lints/flutter.yaml
linter:
  rules:
    
