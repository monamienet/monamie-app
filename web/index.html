<!DOCTYPE html>
<html>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MonAmie">
  <link rel="apple-touch-icon" href="partner/icons/Icon-192.png">

  <!-- Favicon -->

  <title>MonAmie</title>
  <link rel="manifest" href="partner/manifest.json">
  
  <meta name="google-signin-client_id" content="67044253283-9clqcqov1g7mgjm5iq8aj338hraab0na.apps.googleusercontent.com">

  <script src="https://accounts.google.com/gsi/client" async defer></script>
